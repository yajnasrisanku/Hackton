<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalmPath AI — Reset your mind. Refocus your study.</title>
  <meta name="description" content="A student wellbeing and study-support application to pause, reset, and regain focus.">

  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="min-h-full flex flex-col font-sans text-slate-800 antialiased bg-slate-50 selection:bg-teal-100 selection:text-teal-900">

  <!-- Desktop & Tablet Navigation Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" id="nav-brand-logo" class="flex items-center gap-2.5 group cursor-pointer text-decoration-none">
        <div class="w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white text-lg font-bold shadow-md shadow-teal-600/20 group-hover:scale-105 transition-transform">
          🌿
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-slate-900 tracking-tight text-base sm:text-lg">CalmPath</span>
            <span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded bg-teal-100 text-teal-800 uppercase tracking-wide">AI</span>
          </div>
          <span class="text-[10px] font-medium text-slate-500 tracking-tight -mt-0.5 hidden sm:block">Reset your mind. Refocus your study.</span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-1 text-xs font-bold text-slate-600">
        <button id="nav-link-dashboard" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer text-teal-800 bg-teal-50/80">
          Dashboard
        </button>
        <button id="nav-link-checkin" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer">
          Check-in
        </button>
        <button id="nav-link-studyload" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer flex items-center gap-1">
          <span>📚</span> Study Load
        </button>
        <button id="nav-link-patterns" class="px-3 py-1.5 rounded-xl hover:bg-slate-100 hover:text-slate-900 transition-colors cursor-pointer flex items-center gap-1">
          <span>📊</span> My Patterns
        </button>
      </nav>

      <!-- Right Header Controls -->
      <div class="flex items-center gap-2">
        <button id="nav-btn-sound" class="p-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors cursor-pointer" title="Toggle audio chime">
          🔔
        </button>

        <button id="nav-btn-start-reset" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white font-extrabold text-xs shadow-md shadow-teal-600/20 transition-all flex items-center gap-1.5 cursor-pointer">
          <span>+ New Reset</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-main" class="flex-1 w-full max-w-5xl mx-auto pb-24 sm:pb-12">
    <!-- Dynamic views will mount here -->
  </main>

  <!-- Modal Container -->
  <div id="modal-root"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Joyful Celebration Particle Root -->
  <div id="celebration-root" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 py-2 flex items-center justify-around text-center shadow-lg pb-safe">
    <button id="mobile-nav-dashboard" class="flex flex-col items-center gap-0.5 text-teal-700 py-1 px-2 cursor-pointer">
      <span class="text-base">🏠</span>
      <span class="text-[10px] font-bold">Home</span>
    </button>
    <button id="mobile-nav-checkin" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-teal-700 py-1 px-2 cursor-pointer">
      <span class="text-base">⚡</span>
      <span class="text-[10px] font-bold">Reset</span>
    </button>
    <button id="mobile-nav-studyload" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-indigo-700 py-1 px-2 cursor-pointer">
      <span class="text-base">📚</span>
      <span class="text-[10px] font-bold">Tasks</span>
    </button>
    <button id="mobile-nav-patterns" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-teal-700 py-1 px-2 cursor-pointer">
      <span class="text-base">📊</span>
      <span class="text-[10px] font-bold">Patterns</span>
    </button>
  </nav>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-8 text-xs text-slate-500 hidden sm:block">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
      <div>
        <p class="font-bold text-slate-700">CalmPath AI — Student Wellbeing & Study Support</p>
        <p class="text-slate-500 mt-0.5">
          "Reset your mind. Refocus your study." • Non-diagnostic educational tool.
        </p>
      </div>
      <div class="text-[11px] text-slate-400">
        AI-Powered Student Wellbeing Prototype • Privacy Protected
      </div>
    </div>
  </footer>

  <!-- Application Entry Point (Direct file:// and http:// compatible) -->
  <script src="./js/app.js"></script>
</body>
</html>
